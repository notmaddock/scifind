[project]
name = "scifind"
version = "0.1.0"
description = "scifind is a semantic document finding program"
readme = "README.md"
authors = [
    { name = "Maddock García", email = "notmaddock@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel==7.4.0",
    "ipywidgets>=8.1.9",
    "kagglehub[polars-datasets]>=1.0.2",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy==2.5.4",
    "pandas>=3.0.6",
    "polars==2.0.0",
    "pympler>=1.1",
    "pypdf>=6.20.1",
    "sentence-transformers>=6.1.0",
    "torch==2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
capstone = "capstone:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
